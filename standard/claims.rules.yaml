# Minimalist ad standard: policy, tone and language rules.
#
# Derived from 179 corpus observations (standard/corpus/raw/) and verified
# regulatory text (standard/regulatory-sources.md). Severity graded by a human
# against docs/RULE-DERIVATION.md.
#
# GOVERNING PRINCIPLE, derived from the corpus rather than from the brief:
#
#   A claim's legitimacy comes from the evidence attached to it, not from its
#   strength.
#
# The brief describes Minimalist as avoiding exaggerated claims. The corpus does
# not support that. Minimalist runs "Reduces Acne, Blackheads & Excessive Oil";
# The Derma Co runs "Reduces Acne & Blackheads". Same claim, same verb, same
# absence of hedging. What separates them is that Minimalist attaches the study,
# the subject count, the duration and often the testing lab. So no rule here
# penalises claim strength. POLICY-003 penalises missing evidence instead.
#
# source_confidence: primary means the cited text was read in the original.
# secondary means only through a publisher, because the government host refused
# automated retrieval. See docs/CORRECTIONS.md C-004.

version: "1.1.0"

rules:
  # ---------------------------------------------------------------- POLICY --

  - id: POLICY-001
    dimension: policy
    severity: BLOCK
    title: Therapeutic or treatment claim on a cosmetic
    provenance: regulation
    source: "Cosmetics Rules 2020, Rule 36; CDSCO public notice 18 May 2026, File No. COS-1211/2026-eoffice. regulatory-sources.md sections 6 and 7."
    source_confidence: secondary
    verified: true
    rationale: >
      The mechanism is reclassification, not vocabulary. A therapeutic claim
      moves the product out of the cosmetic category and into drug licensing it
      does not hold. Corrected from an earlier D&MR Schedule grounding that did
      not survive checking. See docs/CORRECTIONS.md C-002.
    matcher:
      type: regex
      pattern: "\\b(cures?|curing|heals?|healing|treatment for|medicine for|remedy for)\\b\\s*\\w{0,12}\\s*\\b(acne|pimples?|eczema|psoriasis|rosacea|dermatitis|melasma|hyperpigmentation|scars?)\\b"
    # The matcher is a fast path for the obvious phrasings. It is not the rule.
    # The red team walked straight past it with "heal chronic cystic flare-ups"
    # and "purge cystic pathogenesis", neither of which contains a listed
    # condition. A term list only catches phrasings you already thought of, and
    # thinking of new ones is exactly the adversary's job.
    guidance: >
      Flag any claim that the product treats, cures, heals, resolves, eradicates
      or eliminates a medical condition, however phrased. Clinical or Latinate
      paraphrase does not exempt it: "purge cystic pathogenesis", "eradicate
      dermal bacterial infections" and "resolve inflammatory dermatoses" are all
      therapeutic claims.
      Cosmetic-register claims about appearance are NOT therapeutic. "Helps
      reduce the appearance of blemishes" is fine. The line is treating a
      condition versus improving an appearance.

  - id: POLICY-002
    dimension: policy
    severity: BLOCK
    title: Claim to treat a condition listed in the D&MR Schedule
    provenance: regulation
    source: "Drugs and Magic Remedies (Objectionable Advertisements) Act 1954, s.3(d) and the Schedule. regulatory-sources.md section 5."
    source_confidence: primary
    verified: true
    rationale: >
      The Schedule does not contain acne, pigmentation, dark spots, wrinkles or
      ageing. It does contain Leucoderma, Lupus and Trachoma. A brightening or
      pigmentation product that strays into claiming to treat leucoderma or
      vitiligo engages s.3(d) directly. Narrow, specific, and a live exposure for
      the Alpha Arbutin line.
    matcher:
      type: lexicon
      terms: ["leucoderma", "vitiligo", "lupus", "trachoma"]
    # Same lesson as POLICY-001. The red team reached leucoderma without naming
    # it, via "patchy depigmentation and autoimmune skin conditions".
    guidance: >
      Flag claims to treat or improve a condition in the D&MR Act Schedule even
      when the condition is described rather than named. Leucoderma reached by
      paraphrase is still leucoderma: "patchy depigmentation", "loss of skin
      pigment in patches", "autoimmune white patches" all describe it.
      Do NOT flag ordinary cosmetic pigmentation language. "Fades dark spots"
      and "evens skin tone" concern hyperpigmentation, which is not in the
      Schedule and is a normal cosmetic claim.

  - id: POLICY-003
    dimension: policy
    severity: BLOCK
    title: Quantified efficacy claim without attached substantiation
    provenance: corpus
    source: "ASCI Code Chapter I, clauses 1.1 and 1.2. regulatory-sources.md section 1. Corpus: 20 of 130 Minimalist observations cite a study or lab, 11 give a subject count, 9 give a timeframe, 6 name the testing body."
    source_confidence: primary
    verified: true
    rationale: >
      The core rule. Minimalist makes strong claims and earns them by attaching
      evidence. Competitors make comparable claims with none. So the violation is
      the missing evidence, not the strength of the claim.
    guidance: >
      A quantified efficacy claim is any assertion of an effect carrying a
      number: a percentage of effect, a proportion of users, or a result within
      a stated number of days or weeks.
      Such a claim must carry, within the same creative, at least one of:
      (a) a subject or sample count, (b) a named source, testing body or study,
      or (c) an explicit reference to a clinical or lab result.
      A BARE TIMEFRAME IS NOT EVIDENCE. "over 8 weeks of regular use" is a usage
      instruction, not proof, and the same timeframe cannot both trigger this
      rule and satisfy it. That circularity was a defect in an earlier version
      of this rule and was found by the eval set.
      PASSES: "93% subjects saw significant reduction in active acne in 4 weeks"
      (subject count).
      PASSES: "Thoroughly tested by an independent lab and confirmed SPF of 50"
      (named source).
      FAILS: "Glow in 3 Days". FAILS: "fades dark spots in 14 days".
      FAILS: "Helps reduce the appearance of blemishes over 8 weeks of regular
      use" (timeframe, no evidence).
      Do NOT flag a claim merely for being strong or confident, and do not flag
      an unquantified claim at all. Quote the exact claim span that lacks
      evidence.

  - id: POLICY-004
    dimension: policy
    severity: BLOCK
    title: Superlative or ranking claim without substantiation
    provenance: regulation
    source: "ASCI Code Chapter I clause 1.1; ASCI Guideline on Usage of Awards/Rankings clauses 7 and 8. regulatory-sources.md sections 1 and 3."
    source_confidence: primary
    verified: true
    rationale: >
      Superlatives and rankings relate to matters of objectively ascertainable
      fact and must be capable of substantiation. A ranking claim additionally
      requires published criteria and an undertaking of no commercial
      relationship with the awarding body.
    matcher:
      type: regex
      # "best" alone is deliberately absent. "Best used at night" is a hard
      # negative in the eval set specifically to keep it out. "best <noun>" is
      # matched separately, which catches "the best formula" without catching
      # the adverbial use.
      #
      # The "#1" alternative is held outside the \b group on purpose: \b before
      # "#" can never match, because a preceding space and "#" are both
      # non-word characters, so there is no boundary between them. The eval set
      # caught this as a silent false negative on seed-002.
      pattern: "(?:\\b(?:no\\.?\\s?1|number one|world'?s most|india'?s (?:best|no\\.?\\s?1|number one|most)|most effective|unmatched|unrivall?ed|asia'?s 1st|best (?:formula|serum|product|choice|cream|moisturi[sz]er|sunscreen))\\b|#\\s?1\\b)"
    # The matcher handles "# 1" but not "N o . 1", which the red team used to
    # walk a ranking claim through. Rather than chase every spacing permutation
    # in a regex, the same lesson as POLICY-001 applies: characters can be
    # separated in more ways than a pattern can enumerate, so generalisation
    # goes to the model.
    guidance: >
      Flag ranking and superlative claims however they are written, including
      when characters are spaced or punctuated to evade matching. "N o . 1",
      "N-o-1", "Numero Uno" and "#1" are all ranking claims. Read what the copy
      says when the obfuscation is removed.
      A ranking claim needs published criteria and an undertaking of no
      commercial relationship with the awarding body, so absent a named and
      checkable source it is unsubstantiated.
      Do NOT flag adverbial or ordinary uses: "best used at night", "first
      apply", "one pump".

  - id: POLICY-005
    dimension: policy
    severity: BLOCK
    title: Concentration not present in ProductFacts
    provenance: inference
    source: "Ours. Follows from the brand printing active concentrations on the front of the pack."
    source_confidence: na
    verified: true
    requires_facts: true
    rationale: >
      A stated concentration that does not match the product page is a fabricated
      fact about a real product. On a brand whose entire position is front-of-pack
      concentration disclosure, this is the worst single output the tool could
      produce.
    guidance: >
      Every concentration in the ad that is attached to an ingredient must
      appear identically in ProductFacts.actives. Flag any that does not,
      quoting it exactly.
      CONCENTRATIONS WRITTEN AS WORDS COUNT. "twelve percent pure Ethyl
      Ascorbic Acid" and "five percent Niacinamide" are concentration claims and
      must be checked exactly as though they were digits. The red team used this
      to walk a fabricated concentration straight through.

  - id: POLICY-006
    dimension: policy
    severity: WARN
    title: Comparative claim against an unnamed benchmark
    provenance: regulation
    source: "ASCI Code Chapter IV clause 4.1(a). regulatory-sources.md section 2."
    source_confidence: primary
    verified: true
    rationale: >
      ASCI 4.1(a) requires it be clear what aspects of the advertiser's product
      are compared with what aspects of the competitor's. An unnamed "benchmark
      product" does not obviously clear that bar.
      This rule flags Minimalist's own live copy, deliberately. WARN rather than
      BLOCK because the underlying study exists and is cited, so the defect is
      disclosure, not fabrication.
    matcher:
      type: regex
      pattern: "\\b(the benchmark product|benchmark product|than other \\w+|than the leading|vs\\.? leading|compared to other|ordinary \\w+|regular \\w+ (?:serums?|creams?|sunscreens?))\\b"
    guidance: >
      A comparison against an unnamed CATEGORY is still a comparative claim.
      "Standard drugstore sunscreens leave chalky residue", "off-the-shelf
      market alternatives destabilize under UV" and "unlike ordinary serums"
      all assert a factual comparison the advertiser must be able to
      substantiate, and none of them make clear what is being compared with
      what, as ASCI 4.1(a) requires.
      Flag comparisons whether the other side is a named product, an unnamed
      benchmark, or a whole category.
      Do NOT flag comparisons against the reader's own prior state ("smoother
      than before") or against not using the product.

  - id: POLICY-007
    dimension: policy
    severity: WARN
    title: Approximation attached to a quantified claim
    provenance: regulation
    source: "ASCI Code Chapter I clause 1.1. regulatory-sources.md section 1."
    source_confidence: primary
    verified: true
    rationale: >
      A number presented as objectively ascertainable should not be hedged with
      an approximation symbol. Observed once in the corpus, in "~26% more
      hydration than the benchmark product". Kept at human direction despite
      resting on a single observation.
    matcher:
      type: regex
      pattern: "(~\\s*\\d+|\\bup ?to \\d+\\s?%|\\balmost \\d+\\s?%|\\bnearly \\d+\\s?%)"

  - id: POLICY-008
    dimension: policy
    severity: BLOCK
    title: Absolute or permanence claim
    provenance: regulation
    source: "ASCI Code Chapter I clause 1.1; Cosmetics Rules 2020 Rule 36. regulatory-sources.md sections 1 and 6."
    source_confidence: primary
    verified: true
    rationale: >
      Permanence and absolute claims cannot be substantiated for a topical
      cosmetic. Observed in the contrast set: "bid adieu to acne & blemishes for
      good".
    matcher:
      type: regex
      pattern: "\\b(permanently|forever|for good|guaranteed|never again|once and for all|100%\\s*(?:clear|acne[- ]free|effective))\\b"

  - id: POLICY-009
    dimension: policy
    severity: BLOCK
    title: Testimonial containing a quantified or absolute claim
    provenance: regulation
    source: "ASCI Code Chapter I clauses 1.1 and 1.4. regulatory-sources.md section 1."
    source_confidence: primary
    verified: true
    rationale: >
      An unsubstantiated efficacy claim does not become substantiated by being
      placed in a customer's mouth. Where the testimonial carries a number or an
      absolute, it is a claim like any other and is treated like one.
      Split from POLICY-010 at human direction, so that the severe case is not
      diluted by the ordinary one.
    guidance: >
      Flag a testimonial or quoted customer statement that contains a number, a
      timeframe, or an absolute ("nothing else worked", "completely gone").
      Example: "Nothing else worked on my pimples and marks except this serum".
      Example: "Just 2 months in and my skin is clearer than ever".
      Quote the exact span. Do not flag testimonials that describe experience
      without asserting a measurable outcome.

  - id: POLICY-010
    dimension: policy
    severity: WARN
    title: Testimonial presented as a typical result
    provenance: regulation
    source: "ASCI Code Chapter I clause 1.4, misleading by implication. regulatory-sources.md section 1."
    source_confidence: primary
    verified: true
    rationale: >
      An individual result presented without qualification implies typicality.
      WARN rather than BLOCK because the fix is a disclaimer rather than a
      retraction.
    guidance: >
      Flag an unqualified individual testimonial where no indication is given
      that results vary. Do not double-flag a testimonial already caught by
      POLICY-009.

  - id: POLICY-011
    dimension: policy
    severity: BLOCK
    title: Skin-tone discrimination framing, in copy or imagery
    provenance: regulation
    source: "ASCI Guideline on Advertising for Skin Lightening or Fairness Improvement Products, 14 August 2014, clauses 1 to 4. regulatory-sources.md section 4."
    source_confidence: primary
    verified: true
    rationale: >
      Clause 2 constrains the pre-usage depiction: models must not be shown as
      unattractive, unhappy, depressed or concerned. That is a constraint on
      imagery, not only copy, and it is why a generated background is scored
      rather than treated as decoration.
    guidance: >
      Applies to the image as well as the text. Flag any copy or visual that
      associates darker skin with being unattractive, unhappy, disadvantaged,
      or unsuccessful, or that links skin tone to social, romantic, marital or
      professional prospects. When scoring an image, describe what in the image
      triggers the finding.

  - id: POLICY-012
    dimension: policy
    severity: BLOCK
    title: Cited study is not in the substantiation registry
    provenance: inference
    source: "Ours. Response to a red-team finding, see docs/FAILURE-MODES.md and standard/claims-registry.yaml."
    source_confidence: na
    verified: true
    rationale: >
      POLICY-003 asks whether evidence is attached. It cannot ask whether the
      evidence exists. The red team defeated it with fabricated but
      plausible-looking citations, including a protocol number and a subject
      count, and those passed cleanly.
      No prompt fixes this: a model cannot know whether a study happened. So the
      check moves from "is a study cited" to "is the cited study one of ours",
      which is a lookup rather than an inference.
      DETAIL IS NOT EVIDENCE. A more specific fake citation is more dangerous
      than a vague one, not less.
    guidance: >
      If the advertisement cites a study, trial, protocol, clinical result,
      consumer panel, sample size or testing body, that citation must correspond
      to an entry in the substantiation registry supplied below.
      Flag any citation with no matching registry entry, quoting the citation
      exactly. Do this regardless of how detailed, technical or credible the
      citation appears. A protocol identifier and an n= figure are not evidence
      that a study exists.
      Do NOT flag copy that makes no citation at all: that is POLICY-003's job.
      Do NOT flag a citation that matches a registry entry even loosely in
      wording, provided the product and the substance of the claim line up.

  # ------------------------------------------------------------------ TONE --

  - id: TONE-001
    dimension: tone
    severity: WARN
    title: Fear-based framing
    provenance: corpus
    source: "Corpus: 0 fear appeals across 130 Minimalist observations; multiple in the 49-observation contrast set."
    source_confidence: na
    verified: true
    rationale: >
      Now corpus-grounded rather than a restatement of the brief. The brand's
      persuasive mechanism is information, not anxiety.
    guidance: >
      Flag copy whose persuasive mechanism is anxiety about the reader's skin
      rather than information about the product.

  - id: TONE-002
    dimension: tone
    severity: WARN
    title: Social or romantic consequence framing
    provenance: corpus
    source: "ASCI Skin Lightening guideline clause 1; corpus absence across 130 observations."
    source_confidence: primary
    verified: true
    rationale: >
      Tying skin appearance to social, romantic or professional outcomes is both
      off-brand and specifically named in the ASCI category guideline.
    guidance: >
      Flag copy implying the product improves the reader's social standing,
      desirability, marriage or career prospects.

  - id: TONE-003
    dimension: tone
    severity: WARN
    title: Hype register, intensifiers carrying no information
    provenance: corpus
    source: "Corpus: clinical register across all 8 product pages."
    source_confidence: na
    verified: true
    rationale: >
      Not a ban on colour. Minimalist itself writes "superstar ingredient" and
      "baby-soft". The rule targets intensifiers that replace information, not
      intensifiers that accompany it.
    guidance: >
      Flag intensifiers and adjectives that carry no informational content and
      are not accompanied by a mechanism, ingredient or figure. Do not flag
      vivid language that sits alongside substance.

  - id: TONE-004
    dimension: tone
    severity: WARN
    title: Emotional outcome asserted in place of mechanism
    provenance: corpus
    source: "Corpus: mechanism named in the majority of Minimalist benefit statements, e.g. Niacinamide reduces the sebum level of the skin."
    source_confidence: na
    verified: true
    rationale: >
      The brand explains why something works. Copy that asserts a feeling without
      naming a cause is off-register.
    guidance: >
      Flag benefit statements that assert how the reader will feel without naming
      the active or the mechanism producing it.

  # -------------------------------------------------------------- LANGUAGE --

  - id: LANG-001
    dimension: language
    severity: WARN
    title: Concentration and ingredient must be adjacent
    provenance: corpus
    source: "Corpus: 12 concentration_format observations. Two formats observed, both valid: 'Niacinamide 10% Face Serum' and 'Pure 10% Niacinamide'."
    source_confidence: na
    verified: true
    rationale: >
      The rule is adjacency, not order. Both ingredient-first and
      percentage-first appear in the corpus. A bare percentage with no adjacent
      ingredient is the violation, because it invites the reader to attach the
      number to whatever they like.
    guidance: >
      Flag any percentage presented as an active concentration that is not
      adjacent to the ingredient it belongs to. Do not flag percentages that are
      clearly study results, such as "93% subjects".

  - id: LANG-002
    dimension: language
    severity: WARN
    title: Appearance claims require hedging vocabulary
    provenance: corpus
    source: "Corpus: 14 hedge observations, including 'appearance of pores', 'can modulate', 'in 2 weeks'."
    source_confidence: na
    verified: true
    rationale: >
      The brand consistently hedges claims about visible change with appearance
      language and stated timeframes.
    guidance: >
      Flag claims about visible change stated as fact without hedging language
      ("appearance of", "helps", "visibly") or a stated timeframe.

# CUT DELIBERATELY
#
# Two rules were proposed, built, and then removed. Both cuts are arguments, not
# omissions, and both are in the decision doc.
#
# LANG-003, "name the active and what it does". Corpus-supported in principle:
# Minimalist copy does name the ingredient and state its action. But the rule
# produced a false positive in three consecutive eval runs and needed narrowing
# twice. On the third strike it flagged "Reduces Acne, Blackheads & Excessive
# Oil", which is real brand copy and the exact row the governing finding of this
# whole standard rests on. A rule that flags the evidence for your own thesis is
# not a rule, it is a rule-shaped guess. The structural pattern it was reaching
# for is real; expressing it as a pass/fail check on a single creative is not
# something we could make work.
#
# LANG-004, a safety note on actives-containing creative. The patch-test note
# appears on 2 of 4 pages in corpus batch A and is absent from the Niacinamide
# page. The brand is not consistent, so encoding it would have been
# manufacturing a pattern from noise. Cut rather than relabelled as inference.
#
# See docs/RULE-DERIVATION.md for what each looked like before it was cut.
