# Policy and claims rules.
#
# STATUS: seed set. Every regulation- and corpus-sourced rule below is
# verified:false and therefore inert until a human checks it against actual
# source text (see standard/SOURCES.md).
#
# Do not raise `verified` without reading the cited source. Rules invented by a
# model and dressed up as statute are the worst possible failure for this
# project, which exists to catch unsubstantiated claims.

version: "0.1.0-seed"

rules:
  - id: POLICY-001
    dimension: policy
    severity: BLOCK
    title: Therapeutic or treatment claim on a cosmetic
    provenance: regulation
    source: "Cosmetics Rules 2020, Rule 36 (secondary-sourced); CDSCO public notice 18 May 2026, File No. COS-1211/2026-eoffice (secondary-sourced). See standard/regulatory-sources.md sections 6 and 7."
    verified: false
    rationale: >
      A cosmetic may not be advertised as treating or curing a condition. The
      mechanism is not that "cure" is a banned word: a therapeutic claim
      reclassifies the product out of the cosmetic category and into drug
      licensing, which the product does not hold.
      CORRECTED. This rule previously cited the D&MR Act 1954 Schedule, which
      does not list acne or any common skincare concern. See docs/CORRECTIONS.md
      C-002. Awaiting human review of scope and severity before verification.
    matcher:
      type: lexicon
      terms: ["cures", "cure", "treats", "heals", "eliminates acne", "permanently removes"]

  - id: POLICY-002
    dimension: policy
    severity: BLOCK
    title: Unsubstantiated superlative or ranking claim
    provenance: regulation
    source: "ASCI Code Chapter I, clause 1.1 (primary, verbatim recorded); ASCI Guideline on Usage of Awards/Rankings, clauses 7 and 8 (primary). See standard/regulatory-sources.md sections 1 and 3."
    verified: false
    rationale: >
      Superlatives and rankings relate to matters of objectively ascertainable
      fact and must be capable of substantiation. A ranking claim additionally
      requires published criteria and an undertaking of no commercial
      relationship with the awarding body.
      CORRECTED. This rule previously cited ASCI chapter II, which governs
      offensiveness to public decency, not substantiation. See
      docs/CORRECTIONS.md C-001. Awaiting human review before verification.
    matcher:
      type: regex
      pattern: "\\b(best|no\\.?\\s?1|number one|#1|most effective)\\b"

  - id: POLICY-003
    dimension: policy
    severity: BLOCK
    title: Concentration not present in ProductFacts
    provenance: inference
    source: "Our rule. Follows from the brand printing active concentrations on pack."
    verified: true
    rationale: >
      Minimalist prints active concentrations on the front of the pack. A stated
      concentration that does not match the product page is a fabricated fact
      about a real product, which is the worst thing this tool could ship.
    guidance: >
      Every percentage in the ad must appear identically in ProductFacts.actives.
      Flag any percentage that does not, quoting it exactly as written.

  - id: TONE-001
    dimension: tone
    severity: WARN
    title: Fear-based framing
    provenance: corpus
    source: "TODO verify against corpus: beminimalist.co product pages and live ads"
    verified: false
    rationale: >
      The brief states the brand deliberately avoids the fear-based marketing
      common in the category. Needs corpus confirmation before it is treated as
      a rule rather than a repetition of the brief.
    guidance: >
      Flag copy whose persuasive mechanism is anxiety about the reader's skin
      rather than information about the product.

  - id: LANG-001
    dimension: language
    severity: WARN
    title: Concentration formatting
    provenance: corpus
    source: "TODO verify against corpus: how beminimalist.co actually formats these"
    verified: false
    rationale: >
      Placeholder. The observed format must be extracted from real product
      pages, not assumed. Do not encode a guess here.
    guidance: >
      Placeholder pending corpus extraction.
