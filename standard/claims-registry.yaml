# Substantiation registry.
#
# The list of claims this brand can actually back, and what backs them.
#
# WHY THIS EXISTS. The red team defeated POLICY-003 with fabricated citations:
#
#   "reduces periorbital wrinkle volume by 41% (independent double-blind
#    vehicle-controlled study, n=62, 8-week consumer panel)"
#
# That passed cleanly, because POLICY-003 checks whether evidence is attached,
# and it cannot check whether the evidence exists. No prompt fixes that. A model
# has no way to know whether a study happened.
#
# So the check moves from "is a study cited" to "is the cited study one of ours".
# That converts an unverifiable inference problem into a data lookup, which is
# the kind of problem an organisation can actually own.
#
# EVERY ENTRY IS MACHINE-CHECKED. `product_handle` links the entry to a scraped
# product, and `verbatim` must appear word for word in that product's
# ProductFacts. `npm run test:registry` enforces both. This exists because the
# registry had a claim filed against the wrong product for four commits: the
# 97% oiliness study belongs to Salicylic Acid and was recorded against
# Niacinamide, whose page carries no consumer study at all. POLICY-012 would
# have found the entry and certified a Niacinamide ad making a claim that
# product has never made. See docs/CORRECTIONS.md C-006.
#
# HONEST STATUS: these entries are extracted from beminimalist.co product pages,
# which is what the brand has published, not the study reports themselves. A
# production registry is owned by whoever holds the studies, is versioned
# alongside them, and records the report rather than the marketing summary of
# the report. See docs/FAILURE-MODES.md section 10.

version: "0.2.0"

claims:
  # --- Multi-Vitamin SPF 50 Sunscreen ---------------------------------------
  - id: SUB-001
    product: "SPF 50 Sunscreen"
    product_handle: multi-vitamin-spf-50
    claim: "SPF 50 confirmed by in-vivo testing"
    evidence: "In-vivo evaluation to ISO 24444:2019 by Advanced Science Laboratories, an independent third party. SPF value obtained 56.6, PA rating ++++. Study number MS22.SPF.A1015.UPPL.ISO24444.ST15.REP.REV."
    verbatim: "SPF value obtained: 56.6"
    source_type: independent_lab
    note: "The strongest entry in this registry: a named lab, a named standard, and a study number. This is what the others should look like."

